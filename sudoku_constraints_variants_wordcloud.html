const CATEGORY_DESCRIPTIONS = {"三大核心約束": "數獨的基礎規則：每行、每列、每宮內的數字必須唯一且不重複，構成數獨求解的三重約束體系。", "解題技巧": "基於三約束衍生的邏輯推理方法，包括摒除法、候選數分析、鏈式推理等進階技術。", "標準數獨": "經典 9x9 數獨，填入 1-9 使每行、每列、每 3x3 宮格內數字不重複。", "尺寸變體": "改變網格大小的數獨變體，從 4x4 迷你版到 16x16 超級版。", "自由/不規則變體": "用不規則形狀區域替代標準 3x3 宮格，又稱 Jigsaw / 鋸齒數獨。", "對角線變體": "在標準規則基礎上，增加兩條主對角線也必須包含 1-9 的額外約束。", "算術變體": "引入數學運算約束，如殺手數獨的「籠」要求和值，或乘法數獨等。", "其他變體": "溫度計、箭頭、連續數、大小比較、奇偶限制等多種特色規則變體。", "複合變體": "融合多種規則或特殊結構的數獨，如武士數獨的五連盤、文字數獨等。"};

catNames.forEach(function(cat) {
  const item = document.createElement('div');
  item.className = 'legend-item';
  item.dataset.cat = cat;
  const dot = document.createElement('span');
  dot.className = 'legend-dot';
  dot.style.background = catColors[cat];
  item.appendChild(dot);
  item.appendChild(document.createTextNode(cat));
  item.addEventListener('click', function() { toggleCategory(cat); });
  legend.appendChild(item);
});

function toggleCategory(cat) {
  if (activeCategories.has(cat)) {
    if (activeCategories.size === 1) {
      activeCategories = new Set(catNames);
    } else {
      activeCategories.delete(cat);
    }
  } else {
    activeCategories.add(cat);
  }
  updateDisplay();
}

function updateDisplay() {
  document.querySelectorAll('.legend-item').forEach(function(el) {
    el.classList.toggle('dimmed', !activeCategories.has(el.dataset.cat));
  });
  document.querySelectorAll('.word').forEach(function(el) {
    el.classList.toggle('dimmed', !activeCategories.has(el.dataset.category));
  });
}

// Build word cloud
const wc = document.getElementById('wordcloud');
const maxW = Math.max.apply(null, WORDS.map(function(w) { return w.weight; }));
const minW = Math.min.apply(null, WORDS.map(function(w) { return w.weight; }));

WORDS.forEach(function(w) {
  const span = document.createElement('span');
  span.className = 'word';
  span.textContent = w.text;
  span.dataset.category = w.category;
  var ratio = (w.weight - minW) / (maxW - minW || 1);
  var fontSize = 12 + ratio * 52;
  var opacity = 0.5 + ratio * 0.5;
  span.style.fontSize = fontSize + 'px';
  span.style.color = w.color;
  span.style.opacity = opacity;
  span.style.fontWeight = ratio > 0.6 ? 'bold' : (ratio > 0.3 ? '600' : 'normal');
  span.addEventListener('mouseenter', function(e) { showTooltip(e, w); });
  span.addEventListener('mousemove', moveTooltip);
  span.addEventListener('mouseleave', hideTooltip);
  wc.appendChild(span);
});

var ttWord = document.getElementById('ttWord');
var ttCat = document.getElementById('ttCat');
var ttWeight = document.getElementById('ttWeight');

function showTooltip(e, w) {
  ttWord.textContent = w.text;
  ttWord.style.color = w.color;
  ttCat.textContent = '分類：' + w.category;
  ttWeight.textContent = '權重：' + w.weight + ' / ' + maxW;
  tooltip.classList.add('show');
  moveTooltip(e);
}
function moveTooltip(e) {
  var x = e.clientX + 16, y = e.clientY + 16;
  if (x + 280 > window.innerWidth) x = e.clientX - 296;
  if (y + 100 > window.innerHeight) y = e.clientY - 116;
  tooltip.style.left = x + 'px';
  tooltip.style.top = y + 'px';
}
function hideTooltip() { tooltip.classList.remove('show'); }

  desc.style.cssText = 'font-size:0.82rem;color:#8899aa;margin-bottom:8px';
  desc.textContent = CATEGORY_DESCRIPTIONS[cat];
  card.appendChild(desc);
  var ul = document.createElement('ul');
  words.forEach(function(w) {
    var li = document.createElement('li');
    li.innerHTML = w.text + ' <span style="color:#556;font-size:0.75rem">(' + w.weight + ')</span>';
    ul.appendChild(li);
  });
  card.appendChild(ul);
  infoPanel.appendChild(card);
});
</script>
</body>
</html>
